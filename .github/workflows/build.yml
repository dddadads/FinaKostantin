name: Build macOS Application (Web View with Icon)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Create Launcher Script
      run: |
        cat << 'EOF' > run_app.py
        import os
        import sys
        import subprocess
        import time
        import webbrowser

        if __name__ == '__main__':
            if hasattr(sys, '_MEIPASS'):
                base_path = sys._MEIPASS
            else:
                base_path = os.path.dirname(os.path.abspath(__file__))
                
            # Запускаем именно main.py внутри пакета
            script_path = os.path.join(base_path, 'main.py')
            
            proc = subprocess.Popen(
                [sys.executable, "-m", "streamlit", "run", script_path, "--server.headless", "true"],
                cwd=base_path
            )
            
            time.sleep(3)
            webbrowser.open("http://localhost:8501")
            
            proc.wait()
        EOF

    - name: Build Mac App
      run: |
        # Теперь упаковываем main.py вместо app.py
        pyinstaller --noconfirm --onedir --windowed \
          --name "FinaKostantin" \
          --icon="assets/icon.icns" \
          --add-data "main.py:." \
          --add-data "logic:logic" \
          --add-data "data:data" \
          --add-data "assets:assets" \
          run_app.py

    - name: Copy Files to Bundle
      run: |
        cp main.py dist/FinaKostantin.app/Contents/MacOS/
        cp -R logic dist/FinaKostantin.app/Contents/MacOS/
        cp -R data dist/FinaKostantin.app/Contents/MacOS/
        cp -R assets dist/FinaKostantin.app/Contents/MacOS/

    - name: Sign App
      run: |
        codesign --force --deep --sign - dist/FinaKostantin.app

    - name: Compress App
      run: |
        cd dist
        zip -r FinaKostantin-Mac.zip FinaKostantin.app

    - name: Upload Finished App
      uses: actions/upload-artifact@v4
      with:
        name: FinaKostantin-Mac-SuperGift
        path: dist/FinaKostantin-Mac.zip
