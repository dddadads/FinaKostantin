name: Build macOS PyQt6 Application

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6

    - name: Build Mac App
      run: |
        # Собираем чистое PyQt6 приложение из main.py
        pyinstaller --noconfirm --onedir --windowed \
          --name "FinaKostantin" \
          --icon="assets/icon.icns" \
          --add-data "logic:logic" \
          --add-data "data:data" \
          --add-data "assets:assets" \
          --add-data "ui:ui" \
          main.py

    - name: Sign App
      run: |
        codesign --force --deep --sign - dist/FinaKostantin.app

    - name: Compress App
      run: |
        cd dist
        zip -r FinaKostantin-Mac.zip FinaKostantin.app

    - name: Upload Finished App
      uses: actions/upload-artifact@v4
      with:
        name: FinaKostantin-Mac-SuperGift
        path: dist/FinaKostantin-Mac.zip
