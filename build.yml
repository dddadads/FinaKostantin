name: Build macOS DMG

on:
  push:
    branches: [ main, master ] # Сборка запустится, как только ты загрузишь код

jobs:
  build:
    runs-on: macos-latest # GitHub запускает виртуальный Mac!

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller

    - name: Build .app with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --name "FinaKostantin" \
          --add-data "data:data" \
          --add-data "logic:logic" \
          --add-data "ui:ui" \
          main.py

    - name: Create DMG
      run: |
        # Используем встроенную утилиту macOS для создания простого DMG
        hdiutil create -volname "FinaKostantin" -srcfolder dist/FinaKostantin.app -ov -format UDZO dist/FinaKostantin.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinaKostantin-macOS-DMG
        path: dist/FinaKostantin.dmg